name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features server -- -D warnings
      - run: cargo clippy --no-default-features --all-targets -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - run: cargo check --target wasm32-unknown-unknown --no-default-features --lib
      - run: |
          if [ -f wasm-demo/Cargo.toml ]; then
            cargo fmt --manifest-path wasm-demo/Cargo.toml -- --check
            cargo check --manifest-path wasm-demo/Cargo.toml --target wasm32-unknown-unknown
          fi

  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: ["1.88", stable]
        exclude:
          - os: macos-latest
            rust: "1.88"
          - os: windows-latest
            rust: "1.88"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo test --release
      - run: cargo test --release --features server
      - run: cargo test --no-default-features --release

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  test:
    needs: [lint-and-wasm, test-matrix, deny]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all CI jobs succeeded
        run: |
          if [ "${{ needs.lint-and-wasm.result }}" != "success" ] || \
             [ "${{ needs.test-matrix.result }}" != "success" ] || \
             [ "${{ needs.deny.result }}" != "success" ]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
