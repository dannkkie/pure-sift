name: Deploy WASM Demo to Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "wasm-demo/**"
      - "docs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen-cli and binaryen
        run: |
          WASM_BINDGEN_VER=$(awk '/name = "wasm-bindgen"/{getline; gsub(/"/, "", $3); print $3; exit}' wasm-demo/Cargo.lock)
          cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VER" --locked
          sudo apt-get update && sudo apt-get install -y binaryen
      - name: Build WASM demo
        run: |
          cargo build --manifest-path wasm-demo/Cargo.toml --release --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir docs/pkg wasm-demo/target/wasm32-unknown-unknown/release/pure_sift_wasm_demo.wasm
          wasm-opt -Oz -o docs/pkg/pure_sift_wasm_demo_bg.wasm docs/pkg/pure_sift_wasm_demo_bg.wasm
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
