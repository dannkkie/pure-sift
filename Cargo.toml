[package]
name = "pure-sift"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Pure-Rust SIFT feature extraction (Lowe 2004, expired patent US6711293B1), multi-view geometry, RANSAC/Homography alignment, panorama stitching, and visual catalog search with zero unsafe code."
repository = "https://github.com/dannkkie/pure-sift"
homepage = "https://dannkkie.github.io/pure-sift/"
readme = "README.md"
keywords = ["sift", "computer-vision", "ransac", "homography", "image-matching"]
categories = ["computer-vision", "multimedia::images", "science"]
exclude = [
  "docs/**",
  "fuzz/**",
  "tools/**",
  "wasm-demo/**",
  "showcase_images/**",
  "real_camera_benchmarks/**",
  "research/**",
  "scripts/**",
  "ISSUES_BACKLOG.md",
  "*.png",
  "*.jpg",
]

[features]
default = ["rayon"]
server = ["dep:axum", "dep:tokio", "dep:tracing", "dep:tracing-subscriber"]
rayon = ["dep:rayon"]
extra-formats = ["image/bmp", "image/gif", "image/tiff", "image/webp"]

[dependencies]
# Fast, multi-dimensional array operations (Rust's numpy)
ndarray = "0.16.0"
# Image decoding and manipulation library (trimmed to PNG + JPEG by default; enable `extra-formats` for more)
image = { version = "0.25.0", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
rayon = { version = "1.10", optional = true }
# Optional HTTP API & embedded Web UI server dependencies
axum = { version = "0.8", features = ["multipart"], optional = true }
tokio = { version = "1.0", features = ["full"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
criterion = "0.5"

[[bench]]
name = "sift_pipeline"
harness = false

[profile.dev]
opt-level = 2

[profile.test]
opt-level = 2
